name: Deploy to GitHub Pages

# Builds the static site and pushes the contents of `build/` to the
# `gh-pages` branch, which GitHub Pages can serve at:
#   https://<owner>.github.io/<repo>/
#
# Trigger: manual only. Actions tab → "Deploy to GitHub Pages" → Run workflow.
#
# The site is a single-page app with one root route, but you can ask
# the build to rewrite every asset URL with a prefix so the result
# drops into a sub-path of any host. The `subpath` input is the single
# piece of configuration you need:
#
#   subpath = ""       (default)
#     - build/ contents go to gh-pages/
#     - asset URLs are /_app/...  (no prefix)
#     - serve at https://example.com/         (the page root)
#
#   subpath = "editor"
#     - build/ contents go to gh-pages/editor/
#     - asset URLs are /editor/_app/...
#     - serve at https://example.com/editor/
#
#   subpath = "tools/harper"
#     - build/ contents go to gh-pages/tools/harper/
#     - asset URLs are /tools/harper/_app/...
#     - serve at https://example.com/tools/harper/
#
# The README on the gh-pages branch lists every subpath that has been
# deployed, with timestamps and source commits.
#
# Prerequisites (one-time, in repository Settings → Pages):
#   - Source: "Deploy from a branch"
#   - Branch: gh-pages / (root)
# That is the default for new repos; if you previously picked a different
# setup, change it back to gh-pages.

on:
  workflow_dispatch:
    inputs:
      subpath:
        description: >-
          Sub-path the site will be served from. Examples: "" (the host
          root), "editor" => https://host/editor/, "tools/harper" =>
          https://host/tools/harper/. Asset URLs are rewritten to match,
          and the build is placed under that directory on the gh-pages
          branch.
        required: false
        default: ''
      commit_message:
        description: 'Commit message for the gh-pages branch'
        required: false
        default: ''

permissions:
  contents: write

# Don't deploy twice when a manual run happens shortly after another.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    # Outputs that the deploy job reads. GitHub Actions only forwards
    # step-level outputs within the same job; to share values across
    # jobs you must declare them here.
    outputs:
      subpath:  ${{ steps.subpath.outputs.subpath }}
      base:     ${{ steps.subpath.outputs.base }}
      deploy_dir: ${{ steps.subpath.outputs.deploy_dir }}
      artifact: ${{ steps.subpath.outputs.artifact }}
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Normalise subpath input
        id: subpath
        run: |
          set -euo pipefail
          # Trim whitespace and any leading/trailing slashes.
          RAW="${{ inputs.subpath }}"
          SUB=$(printf '%s' "$RAW" | sed -E 's#^/+##; s#/+$##; s#\s+##g')
          if [ -z "$SUB" ]; then
            # Host root: no prefix on asset URLs.
            BASE="/"
            DEPLOY_DIR="(root)"
            ARTIFACT="site-root"
          else
            # SvelteKit requires kit.paths.base to start with "/" and NOT
            # end with one. We pass the prefix through BASE to the build.
            BASE="/$SUB"
            # On the gh-pages branch we put the build under the same
            # subpath so URLs match up at the host.
            DEPLOY_DIR="$SUB"
            ARTIFACT="site-$(printf '%s' "$SUB" | tr '/' '-')"
          fi
          echo "subpath=$SUB"      >> "$GITHUB_OUTPUT"
          echo "base=$BASE"        >> "$GITHUB_OUTPUT"
          echo "deploy_dir=$DEPLOY_DIR" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "::notice::subpath='$SUB', built with BASE='$BASE'"

      - name: Build
        env:
          BASE: ${{ steps.subpath.outputs.base }}
        run: pnpm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f build/index.html || { echo "::error::build/index.html missing"; exit 1; }
          test -d build/_app       || { echo "::error::build/_app/ missing"; exit 1; }
          WASM=$(ls build/_app/immutable/assets/*.wasm 2>/dev/null | head -1 || true)
          if [ -z "$WASM" ]; then
            echo "::error::no .wasm in build/_app/immutable/assets/"
            exit 1
          fi
          # Sanity-check that asset URLs match the requested base. SvelteKit
          # only emits the trailing-"/" form when base is "/" (host root).
          BASE="${{ steps.subpath.outputs.base }}"
          EXPECTED_PREFIX="$BASE"
          if [ "$EXPECTED_PREFIX" = "/" ]; then EXPECTED_PREFIX=""; fi
          SAMPLE=$(grep -oE 'href="/[^"]*\.(js|css)"' build/index.html | head -1 || true)
          if [ -z "$SAMPLE" ]; then
            echo "::error::no asset URLs found in build/index.html"
            exit 1
          fi
          if ! printf '%s' "$SAMPLE" | grep -qE "href=\"${EXPECTED_PREFIX}/_app/"; then
            echo "::error::asset URL does not start with expected prefix '${EXPECTED_PREFIX}/_app/': $SAMPLE"
            exit 1
          fi
          echo "OK: build/index.html + asset URLs use prefix '$EXPECTED_PREFIX'"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.subpath.outputs.artifact }}
          path: build
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Push to gh-pages branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          # We need history on the gh-pages branch so we can merge the new
          # subpath in without clobbering previously-deployed subpaths.
          fetch-depth: 0
          # Do NOT check out the source tree. The deploy job must only ever
          # produce the static-site build, never any of the repository
          # source code. The 'sparse-checkout' settings below ensure that
          # even on the first run (where the working tree would otherwise
          # contain main's source files) we end up with an empty tree.
          sparse-checkout: ''
          sparse-checkout-cone-mode: false

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: /tmp/site

      - name: Merge into gh-pages
        run: |
          set -euo pipefail
          # Sidecar file written by the build job (mostly informational;
          # the authoritative values are the job-level outputs from build).
          # shellcheck disable=SC1091
          . /tmp/site/.deploy-info 2>/dev/null || true
          DEPLOY_DIR="${{ needs.build.outputs.deploy_dir }}"
          BASE="${{ needs.build.outputs.base }}"

          echo "Deploying directory: $DEPLOY_DIR  (built with BASE='$BASE')"

          # The working tree was checked out empty (sparse-checkout). Make
          # sure it really is empty in case some file slipped through.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          git fetch origin gh-pages || true

          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
              # Existing gh-pages: re-attach to it and incrementally update
              # only the directory we're replacing. We pull its tree into
              # the working copy first so we can read its README.
              git checkout -B gh-pages origin/gh-pages
          else
              # First deploy ever: orphan branch starting from a clean tree.
              git checkout --orphan gh-pages
              # `git checkout --orphan` keeps the index but stages nothing;
              # wipe the index too so a stray `git add -A` later can't pick
              # up anything from the previous main checkout.
              git rm -rfq --cached . 2>/dev/null || true
          fi

          # Preserve the gh-pages README that tracks every deployed subpath.
          PRESERVED=""
          for f in README.md; do
              if [ -f "$f" ]; then
                  cp "$f" "/tmp/.preserved-$f"
                  PRESERVED="$PRESERVED $f"
              fi
          done
          # Wipe the previous version of the directory we're replacing.
          if [ "$DEPLOY_DIR" = "(root)" ]; then
              # Remove every tracked file on gh-pages — we are about to
              # replace the lot with the freshly built site.
              git ls-files | xargs -r rm -f
          else
              rm -rf "$DEPLOY_DIR"
          fi
          # Restore preserved files.
          for f in $PRESERVED; do
              cp "/tmp/.preserved-$f" "$f"
              rm -f "/tmp/.preserved-$f"
          done

          # Copy the new build on top.
          if [ "$DEPLOY_DIR" = "(root)" ]; then
              cp -a /tmp/site/. .
          else
              mkdir -p "$DEPLOY_DIR"
              cp -a /tmp/site/. "$DEPLOY_DIR/"
          fi
          rm -f .deploy-info
          rm -f "$DEPLOY_DIR/.deploy-info"

          # Update the README table.
          SOURCE_SHA="${{ github.sha }}"
          SOURCE_REF="${{ github.ref }}"
          DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SUBPATH_INPUT="${{ inputs.subpath }}"
          export DEPLOY_DIR BASE SOURCE_SHA SOURCE_REF DEPLOYED_AT SUBPATH_INPUT
          python3 - <<'PY'
          import os, datetime, pathlib
          deploy_dir  = os.environ['DEPLOY_DIR']
          base        = os.environ['BASE']
          source_sha  = os.environ['SOURCE_SHA']
          source_ref  = os.environ['SOURCE_REF']
          deployed_at = os.environ['DEPLOYED_AT']
          sub_input   = os.environ.get('SUBPATH_INPUT', '')

          ts = datetime.datetime.fromisoformat(deployed_at.replace('Z', '+00:00'))
          ts_str = ts.strftime('%Y-%m-%d %H:%M:%S UTC')

          readme = pathlib.Path('README.md')
          marker = '<!-- begin deployments -->'
          end_marker = '<!-- end deployments -->'

          if deploy_dir == '(root)':
              path_label = '/'
              sub_label = '(host root)'
              base_label = '(none)'
          else:
              path_label = '/' + deploy_dir + '/'
              sub_label = 'subpath: ' + (sub_input or deploy_dir)
              base_label = base

          new_row = (
              f'| {path_label} | {sub_label} | `{base_label}` | {ts_str} | '
              f'`{source_sha[:7]}` |'
          )

          text = readme.read_text() if readme.exists() else ''
          if marker in text and end_marker in text:
              head, _, tail = text.partition(marker)
              body, _, _after = tail.partition(end_marker)
              lines = [
                  ln for ln in body.strip().splitlines()
                  if ln.strip() and not ln.startswith('| ---')
              ]
              seen, kept = set(), []
              for ln in lines:
                  key = ln.split('|', 2)[1].strip()
                  if key == path_label.strip() or key in seen:
                      continue
                  seen.add(key)
                  kept.append(ln)
              kept.insert(0, new_row)
              new_body = '\n' + '\n'.join(kept) + '\n'
              text = head + marker + new_body + end_marker
          else:
              preamble = (
                  '# gh-pages deployments\n\n'
                  'Each row below is one (subpath, base) combination that has '
                  'been deployed. To serve one of these at a host, drop the '
                  'matching sub-directory from the gh-pages branch into the '
                  'corresponding path on your web server.\n\n'
              )
              header = (
                  '| Path | Source subpath | Built with base | Last deployed | Source commit |\n'
                  '| --- | --- | --- | --- | --- |\n'
              )
              text = preamble + marker + '\n' + header + new_row + '\n' + end_marker + '\n'
          readme.write_text(text)
          PY

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
              echo "No changes to commit on gh-pages."
              exit 0
          fi

          if [ -n "${{ github.event.inputs.commit_message }}" ]; then
              MSG="${{ github.event.inputs.commit_message }}"
          else
              MSG="deploy: $DEPLOY_DIR from $SOURCE_SHA"
          fi
          git commit -q -m "$MSG"

          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages

          # GitHub Pages is configured to serve from the gh-pages branch
          # (Settings → Pages → Branch: gh-pages, /(root)). Pushing to that
          # branch is what triggers a deployment — no extra action needed.
