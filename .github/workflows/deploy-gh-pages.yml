name: Deploy to GitHub Pages

# Builds the static site and pushes the contents of `build/` to the
# `gh-pages` branch, which GitHub Pages can serve at:
#   https://<owner>.github.io/<repo>/
#
# Two trigger modes:
#   1. Manual: Actions tab → "Deploy to GitHub Pages" → Run workflow.
#   2. Automatic on push to main: enabled by setting the repository
#      variable AUTO_DEPLOY=true in Settings → Secrets and variables →
#      Actions → Variables. (Off by default so a stray commit never
#      silently republishes your site.)
#
# Prerequisites (one-time, in repository Settings → Pages):
#   - Source: "Deploy from a branch"
#   - Branch: gh-pages / (root)
# That is the default for new repos; if you previously picked a different
# setup, change it back to gh-pages.

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message for the gh-pages branch'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

# Don't deploy twice when a push to main happens shortly after a manual run.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Skip if AUTO_DEPLOY is not enabled (push trigger only)
        # Only relevant for the `push` trigger. `workflow_dispatch` and
        # `workflow_call` should always run the build.
        if: github.event_name == 'push' && vars.AUTO_DEPLOY != 'true'
        run: |
          echo "AUTO_DEPLOY is not 'true' — skipping auto-deploy."
          echo "To enable automatic deploys on push to main, set the"
          echo "repository variable AUTO_DEPLOY=true."
          exit 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build
        run: pnpm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f build/index.html          || { echo "::error::build/index.html missing"; exit 1; }
          test -d build/_app                || { echo "::error::build/_app/ missing"; exit 1; }
          WASM=$(ls build/_app/immutable/assets/*.wasm 2>/dev/null | head -1 || true)
          if [ -z "$WASM" ]; then
            echo "::error::no .wasm in build/_app/immutable/assets/"
            exit 1
          fi
          echo "OK: build/index.html + build/_app/ + WASM asset present"

      - name: Prepare deploy artifact
        run: |
          # Keep a copy of the built site so the deploy job (a different
          # runner) can publish it without rebuilding.
          cp -a build /tmp/site
          echo "deployed at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/site/.deploy-info

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: /tmp/site
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Push to gh-pages branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: /tmp/site

      - name: Push build/ to gh-pages branch
        run: |
          set -euo pipefail
          # We push the contents of build/ (not the build/ directory itself),
          # because that is what GitHub Pages serves at the project root.

          # Prepare an empty, orphaned branch with just our files.
          TMP=$(mktemp -d)
          cp -a /tmp/site/. "$TMP/"
          cd "$TMP"
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan gh-pages
          git add -A

          # Pick a sensible commit message.
          if [ -n "${{ github.event.inputs.commit_message }}" ]; then
            MSG="${{ github.event.inputs.commit_message }}"
          else
            MSG="deploy: ${{ github.sha }}"
          fi
          git commit -q -m "$MSG"

          # Force-push (this is gh-pages; we own it). Use the GITHUB_TOKEN
          # the runner provides automatically.
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages

      - name: Trigger Pages deployment
        id: deployment
        uses: actions/deploy-pages@v4
