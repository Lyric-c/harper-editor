name: Deploy to GitHub Pages

# Builds the static site and pushes the contents of `build/` to the
# `gh-pages` branch, which GitHub Pages can serve at:
#   https://<owner>.github.io/<repo>/
#
# Trigger: manual only. Actions tab → "Deploy to GitHub Pages" → Run workflow.
#
# The site is a single-page app with one root route, so there is no
# per-deploy subpath or base-path input to choose.
#
# Prerequisites (one-time, in repository Settings → Pages):
#   - Source: "Deploy from a branch"
#   - Branch: gh-pages / (root)
# That is the default for new repos; if you previously picked a different
# setup, change it back to gh-pages.

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message for the gh-pages branch'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

# Don't deploy twice when a manual run happens shortly after another.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build
        run: pnpm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f build/index.html || { echo "::error::build/index.html missing"; exit 1; }
          test -d build/_app       || { echo "::error::build/_app/ missing"; exit 1; }
          WASM=$(ls build/_app/immutable/assets/*.wasm 2>/dev/null | head -1 || true)
          if [ -z "$WASM" ]; then
            echo "::error::no .wasm in build/_app/immutable/assets/"
            exit 1
          fi
          echo "OK: build/index.html + build/_app/ + WASM asset present"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Push to gh-pages branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: /tmp/site

      - name: Push to gh-pages branch
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          cp -a /tmp/site/. "$TMP/"
          cd "$TMP"
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan gh-pages
          git add -A

          if [ -n "${{ github.event.inputs.commit_message }}" ]; then
            MSG="${{ github.event.inputs.commit_message }}"
          else
            MSG="deploy: ${{ github.sha }}"
          fi
          git commit -q -m "$MSG"

          # Force-push; this is gh-pages, we own it.
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages

      - name: Trigger Pages deployment
        id: deployment
        uses: actions/deploy-pages@v4
